# ChinaTextbookStudyFree — Nginx 静态站点配置
# 覆盖镜像默认 conf.d/default.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---------- 静态页面（Next.js export，目录即 index.html）----------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- TTS 音频 .opus（正确 MIME + 长缓存 + Range 支持）----------
    location ~* \.opus$ {
        types { audio/ogg opus; }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------- 图片（故事配图 / 课本原页 / 图标）----------
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------- JS / CSS（构建产物带 hash，可长缓存）----------
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- 数据 JSON（题库/课文/故事，短缓存便于内容更新）----------
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}

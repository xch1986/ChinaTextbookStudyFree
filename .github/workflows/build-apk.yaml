name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          set -e
          mkdir -p apk/www
          cd apk
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core @capacitor/android
          npx cap init "小学全科" "com.chinastudyfree.app" --web-dir=www --no-git
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.chinastudyfree.app",
            "appName": "小学全科",
            "webDir": "www",
            "server": {
              "url": "http://813999.xyz:8088",
              "cleartext": true,
              "androidScheme": "http"
            }
          }
          JSON
          npx cap add android

      - name: Apply Android tweaks
        run: |
          set -e
          MANIFEST=apk/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          python3 - <<'PY'
          p = "apk/android/app/src/main/java/com/chinastudyfree/app/MainActivity.kt"
          s = open(p, encoding="utf-8").read()
          inject = '''
            override fun onWindowFocusChanged(hasFocus: Boolean) {
                super.onWindowFocusChanged(hasFocus)
                if (hasFocus) {
                    window.decorView.systemUiVisibility = (
                        android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                        or android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                        or android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                        or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                        or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                        or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    )
                }
            }
        '''
          idx = s.rfind("}")
          s = s[:idx] + inject + s[idx:]
          open(p, "w", encoding="utf-8").write(s)
          print("MainActivity patched")
          PY

      - name: Generate launcher icons
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import urllib.request, os
          url = "https://raw.githubusercontent.com/wuwangzhang1216/ChinaTextbookStudyFree/main/apps/web/public/icons/icon-512.png"
          tmp = "/tmp/icon.png"
          urllib.request.urlretrieve(url, tmp)
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for dpi,px in sizes.items():
              d = f"apk/android/app/src/main/res/mipmap-{dpi}"
              img = Image.open(tmp).convert("RGBA").resize((px,px), Image.LANCZOS)
              img.save(os.path.join(d,"ic_launcher.png"))
              img.save(os.path.join(d,"ic_launcher_round.png"))
          print("icons done")
          PY

      - name: Build debug APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chinastudyfree-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          set -e
          mkdir -p apk/www
          cd apk
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core @capacitor/android @capacitor/cli
          npx cap init "小学全科" "com.chinastudyfree.app" --web-dir=www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.chinastudyfree.app",
            "appName": "小学全科",
            "webDir": "www",
            "server": {
              "url": "http://813999.xyz:8088",
              "cleartext": true,
              "androidScheme": "http"
            }
          }
          JSON
          npx cap add android
          echo "=== generated files ==="
          find apk/android/app/src/main -name "MainActivity*" -o -name "styles.xml" -o -name "colors.xml" | sort

      - name: Apply Android enhancements
        run: |
          set -e
          # ===== 1. Manifest: cleartext =====
          MANIFEST=apk/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"

          # ===== 2. MainActivity: fullscreen + error page + retry bridge =====
          MAINACT=$(find apk/android -name "MainActivity.kt" -o -name "MainActivity.java" | head -1)
          echo "MainActivity: $MAINACT"
          if [ -n "$MAINACT" ]; then
            python3 - "$MAINACT" <<'PY'
          import sys
          p = sys.argv[1]
          if p.endswith('.java'):
              content = r'''package com.chinastudyfree.app;

import android.os.Bundle;
import android.webkit.JavascriptInterface;
import android.webkit.WebResourceError;
import android.webkit.WebResourceRequest;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;
import com.getcapacitor.BridgeWebViewClient;

public class MainActivity extends BridgeActivity {
    private WebView webView;
    private static final String HOME_URL = "http://813999.xyz:8088";

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = getBridge().getWebView();

        // 网络错误时显示本地错误页（带重试按钮）
        webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {
            @Override
            public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                if (request != null && request.isForMainFrame()) {
                    view.loadUrl("file:///android_asset/error.html");
                }
            }
        });

        // 错误页"重试"按钮桥
        webView.addJavascriptInterface(new Object() {
            @JavascriptInterface
            public void retry() {
                runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                        webView.loadUrl(HOME_URL);
                    }
                });
            }
        }, "AndroidBridge");
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) {
            getWindow().getDecorView().setSystemUiVisibility(
                android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
        }
    }
}
'''
          else:
              content = r'''package com.chinastudyfree.app;

import android.os.Bundle;
import android.webkit.JavascriptInterface;
import android.webkit.WebResourceError;
import android.webkit.WebResourceRequest;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;
import com.getcapacitor.BridgeWebViewClient;

class MainActivity : BridgeActivity() {
    private var webView: WebView? = null
    private val HOME_URL = "http://813999.xyz:8088"

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        webView = bridge.webView

        webView?.setWebViewClient(object : BridgeWebViewClient(bridge) {
            override fun onReceivedError(view: WebView?, request: WebResourceRequest?, error: WebResourceError?) {
                if (request?.isForMainFrame == true) {
                    view?.loadUrl("file:///android_asset/error.html")
                }
            }
        })

        webView?.addJavascriptInterface(object {
            @JavascriptInterface
            fun retry() {
                runOnUiThread {
                    webView?.loadUrl(HOME_URL)
                }
            }
        }, "AndroidBridge")
    }

    override fun onWindowFocusChanged(hasFocus: Boolean) {
        super.onWindowFocusChanged(hasFocus)
        if (hasFocus) {
            window.decorView.systemUiVisibility = (
                android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                or android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                or android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
            )
        }
    }
}
'''
          open(p, "w", encoding="utf-8").write(content)
          print("MainActivity rewritten:", p)
          PY
          fi

          # ===== 3. Error page (assets) =====
          mkdir -p apk/android/app/src/main/assets
          cat > apk/android/app/src/main/assets/error.html <<'HTML'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网络错误</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1565C0 0%, #42A5F5 100%);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; color: #fff; padding: 24px; }
  .icon { font-size: 72px; margin-bottom: 16px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; letter-spacing: 2px; }
  p { font-size: 17px; opacity: .92; margin-bottom: 6px; }
  .sub { font-size: 14px; opacity: .7; margin-bottom: 28px; }
  button {
    background: #fff; color: #1565C0; border: none; border-radius: 32px;
    font-size: 17px; font-weight: 600; padding: 14px 52px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); transition: transform .12s;
  }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📚</div>
    <h1>小学全科</h1>
    <p>连接学习服务失败</p>
    <p class="sub">请检查网络连接后重试</p>
    <button onclick="AndroidBridge.retry()">重新连接</button>
  </div>
</body>
</html>
HTML
          echo "error.html written"

          # ===== 4. Splash: windowBackground (brand blue + icon) =====
          mkdir -p apk/android/app/src/main/res/drawable
          cat > apk/android/app/src/main/res/drawable/splash_bg.xml <<'XML'
<?xml version="1.0" encoding="utf-8"?>
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="#1565C0"/>
    <item android:gravity="center">
        <bitmap android:src="@mipmap/ic_launcher" android:gravity="center"/>
    </item>
</layer-list>
XML
          python3 - <<'PY'
          import os
          p = "apk/android/app/src/main/res/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          if "windowBackground" not in s:
              marker = '<style name="AppTheme.NoActionBar"'
              idx = s.find(marker)
              if idx != -1:
                  insert_at = s.find(">", idx) + 1
                  s = s[:insert_at] + "\n        <item name=\"android:windowBackground\">@drawable/splash_bg</item>" + s[insert_at:]
                  open(p, "w", encoding="utf-8").write(s)
                  print("splash bg patched")
              else:
                  print("NoActionBar style not found, skip")
          else:
              print("windowBackground already present")
          PY

          # ===== 5. Kotlin stdlib fix =====
          python3 - <<'PY'
          p = "apk/android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "configurations.all" not in s:
              block = ("configurations.all {\n"
                       "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n"
                       "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n"
                       "}\n\n")
              s = s.replace("dependencies {", block + "dependencies {", 1)
              open(p, "w", encoding="utf-8").write(s)
              print("kotlin fix applied")
          else:
              print("kotlin fix already present")
          PY

      - name: Generate launcher icons
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import urllib.request, os
          url = "https://raw.githubusercontent.com/wuwangzhang1216/ChinaTextbookStudyFree/main/apps/web/public/icons/icon-512.png"
          tmp = "/tmp/icon.png"
          urllib.request.urlretrieve(url, tmp)
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for dpi,px in sizes.items():
              d = f"apk/android/app/src/main/res/mipmap-{dpi}"
              img = Image.open(tmp).convert("RGBA").resize((px,px), Image.LANCZOS)
              img.save(os.path.join(d,"ic_launcher.png"))
              img.save(os.path.join(d,"ic_launcher_round.png"))
          print("icons done")
          PY

      - name: Build debug APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chinastudyfree-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk

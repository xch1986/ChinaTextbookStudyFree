name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          set -e
          mkdir -p apk/www
          cd apk
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core @capacitor/android @capacitor/cli
          npx cap init "小学全科" "com.chinastudyfree.app" --web-dir=www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.chinastudyfree.app",
            "appName": "小学全科",
            "webDir": "www",
            "server": {
              "url": "http://813999.xyz:8088",
              "cleartext": true,
              "androidScheme": "http"
            }
          }
          JSON
          npx cap add android
          find apk/android -name "MainActivity*" | sort

      - name: Apply Android enhancements
        run: |
          set -e
          MANIFEST=apk/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          MAINACT=$(find apk/android -name "MainActivity.java" | head -1)
          echo "MainActivity: $MAINACT"
          if [ -n "$MAINACT" ]; then
            echo "$MAIN_JAVA_B64" | base64 -d > "$MAINACT"
            echo "MainActivity rewritten"
          fi
          mkdir -p apk/android/app/src/main/assets
          echo "$ERROR_HTML_B64" | base64 -d > apk/android/app/src/main/assets/error.html
          echo "error.html written"
          mkdir -p apk/android/app/src/main/res/drawable
          echo "$SPLASH_XML_B64" | base64 -d > apk/android/app/src/main/res/drawable/splash_bg.xml
          echo "splash_bg.xml written"
          echo "$COLOR_PATCH_B64" | base64 -d > /tmp/patch_color.py
          python3 /tmp/patch_color.py
          echo "$STYLES_PATCH_B64" | base64 -d > /tmp/patch_styles.py
          python3 /tmp/patch_styles.py
          echo "$KOTLIN_PATCH_B64" | base64 -d > /tmp/patch_kotlin.py
          python3 /tmp/patch_kotlin.py
          echo "$STYLES_PATCH_B64" | base64 -d > /tmp/patch_styles.py
          python3 /tmp/patch_styles.py
          echo "$KOTLIN_PATCH_B64" | base64 -d > /tmp/patch_kotlin.py
          python3 /tmp/patch_kotlin.py
        env:
          MAIN_JAVA_B64: 
          ERROR_HTML_B64: 
          SPLASH_XML_B64: 

          STYLES_PATCH_B64: 
          KOTLIN_PATCH_B64: 

          COLOR_PATCH_B64: 
      - name: Generate launcher icons
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import urllib.request, os
          url = "https://raw.githubusercontent.com/wuwangzhang1216/ChinaTextbookStudyFree/main/apps/web/public/icons/icon-512.png"
          tmp = "/tmp/icon.png"
          urllib.request.urlretrieve(url, tmp)
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for dpi,px in sizes.items():
              d = f"apk/android/app/src/main/res/mipmap-{dpi}"
              img = Image.open(tmp).convert("RGBA").resize((px,px), Image.LANCZOS)
              img.save(os.path.join(d,"ic_launcher.png"))
              img.save(os.path.join(d,"ic_launcher_round.png"))
          print("icons done")
          PY

      - name: Build debug APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chinastudyfree-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
